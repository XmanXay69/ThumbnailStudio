<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#33205C"/>
      <stop offset="0.5" stop-color="#181030"/>
      <stop offset="1" stop-color="#0C0816"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A0FF"/>
      <stop offset="1" stop-color="#8B3DFF"/>
    </linearGradient>
    <!-- Kept tight: a wide blur reads as mush once the icon is 32px in a Dock. -->
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="188" fill="url(#bg)"/>
  <rect x="94" y="94" width="836" height="836" rx="187" fill="none"
        stroke="#A26BFF" stroke-opacity="0.30" stroke-width="4"/>

  <!-- The whole idea in one picture: a long recording reduced to its peaks.
       Bright bars are what survives the cut; dim ones are what gets trimmed. -->
  <g filter="url(#glow)" fill="url(#wave)">
    <rect x="248" y="546" width="36" height="96"  rx="18" opacity="0.26"/>
    <rect x="312" y="470" width="36" height="172" rx="18" opacity="0.32"/>
    <rect x="376" y="330" width="36" height="312" rx="18"/>
    <rect x="440" y="252" width="36" height="390" rx="18"/>
    <rect x="504" y="386" width="36" height="256" rx="18"/>
    <rect x="568" y="540" width="36" height="102" rx="18" opacity="0.28"/>
    <rect x="632" y="296" width="36" height="346" rx="18"/>
    <rect x="696" y="428" width="36" height="214" rx="18"/>
    <rect x="760" y="552" width="36" height="90"  rx="18" opacity="0.26"/>
  </g>

  <!-- Trim line with the playhead sitting on it -->
  <rect x="216" y="726" width="592" height="12" rx="6" fill="#8B3DFF" opacity="0.5"/>
  <circle cx="512" cy="732" r="86" fill="#0C0816"/>
  <circle cx="512" cy="732" r="86" fill="none" stroke="#C9A0FF" stroke-width="12"/>
  <path d="M486 692 L570 732 L486 772 Z" fill="#C9A0FF"/>
</svg>
